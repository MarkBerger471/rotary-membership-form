<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Contacts · Admin | Rotary Club Bangkok DACH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="https://brandcenter.rotary.org/images/default-source/guidelines-images/color/rotary_masterbrand_simplified-color_rgb.svg" type="image/svg+xml" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rotary: { blue: '#17458f', gold: '#f7a81b', azure: '#0067c8', sky: '#00a2e0', cranberry: '#d41367' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.6s ease-out' },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="font-sans text-white antialiased">

  <header class="sticky top-0 z-50 glass-header">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity" title="Application page">
        <img src="https://rotary-bkkdach.clubdesk.com/clubdesk/wwwfiles/logo.png" alt="Rotary Club Bangkok DACH" class="h-12 w-auto rounded-lg" />
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">Rotary Club</h1>
          <p class="text-xs text-glass-gold font-medium -mt-0.5">Bangkok DACH</p>
        </div>
      </a>
      <div class="flex items-center gap-4 text-sm text-glass-secondary">
        <div class="hidden sm:flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>office@rotary-club-bangkok-dach.org</span>
        </div>
        <button onclick="adminLogout()" class="text-white/40 hover:text-white/70 text-sm transition-colors flex items-center gap-1" title="Logout">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </div>
  </header>

  <header class="px-4 py-3" style="background: rgba(10, 22, 40, 0.6); backdrop-filter: blur(40px); border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div class="max-w-6xl mx-auto flex items-center">
      <div class="flex items-center gap-3">
        <a href="/admin" class="text-white/50 hover:text-white/80 transition-colors" title="Back to Admin">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/></svg>
        </a>
        <div class="h-5 w-px bg-white/20"></div>
        <h1 class="text-lg font-bold">Member Contacts</h1>
        <span class="text-xs bg-rotary-gold/20 text-rotary-gold px-2 py-0.5 rounded-full font-medium">Admin</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 animate-fade-in">
    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-white/10 flex flex-wrap items-center gap-3 justify-between">
        <div>
          <h2 class="font-bold text-lg">Member Directory</h2>
          <p id="contactsMeta" class="text-white/40 text-xs mt-0.5">&nbsp;</p>
        </div>
        <div class="flex items-center gap-2 flex-1 sm:flex-none sm:min-w-[280px]">
          <input type="search" id="contactsSearch" class="glass-input flex-1 px-3 py-2 rounded-lg text-sm" placeholder="Search name, email, city…" />
          <button onclick="loadContacts()" class="btn-secondary px-3 py-2 rounded-lg text-sm font-medium" title="Refresh">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
          <button onclick="emailAllMembers()" id="emailAllBtn" class="btn-secondary px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 whitespace-nowrap" title="Write an email to everyone shown">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            Email all
          </button>
          <button onclick="openMemberForm()" class="btn-primary px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1.5 whitespace-nowrap">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Add
          </button>
        </div>
      </div>
      <div id="statusFilters" class="px-6 pt-4 flex flex-wrap gap-2"></div>
      <div id="contactsLoading" class="px-6 py-12 text-center text-white/40">
        <svg class="w-6 h-6 animate-spin mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        Loading contacts...
      </div>
      <div id="contactsEmpty" class="hidden px-6 py-12 text-center text-white/40">
        <p class="font-medium">No member contacts yet</p>
      </div>
      <div id="contactsGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 p-4"></div>
    </div>
  </main>

  <div id="memberModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70"
       onclick="if (event.target === this) closeMemberForm()">
    <div class="glass-card rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
      <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between">
        <h3 id="memberModalTitle" class="font-bold text-lg">Add Member</h3>
        <button onclick="closeMemberForm()" class="text-white/40 hover:text-white transition-colors" title="Close">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="px-6 pt-6 flex items-center gap-4">
        <div id="mfPhotoPreview" class="w-16 h-16 rounded-full bg-rotary-gold/20 text-rotary-gold flex items-center justify-center text-lg font-bold flex-shrink-0 overflow-hidden">—</div>
        <div class="flex flex-col gap-1.5">
          <div class="flex gap-2">
            <button type="button" onclick="document.getElementById('mfPhotoInput').click()" class="btn-secondary px-3 py-1.5 rounded-lg text-xs font-medium">Choose photo</button>
            <button type="button" id="mfPhotoRemove" onclick="removeFormPhoto()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-white/50 hover:text-red-300 transition-colors hidden">Remove</button>
          </div>
          <p class="text-[11px] text-white/35">JPEG or PNG. Cropped to a square and resized automatically.</p>
        </div>
        <input type="file" id="mfPhotoInput" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="pickFormPhoto(this)" />
      </div>
      <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="text-xs text-white/50">First name
          <input id="mfFirstName" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50">Last name
          <input id="mfLastName" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50 sm:col-span-2">Email
          <input id="mfEmail" type="email" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50">Phone
          <input id="mfPhone" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50">WhatsApp
          <input id="mfWhatsapp" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50 sm:col-span-2">LINE name
          <input id="mfLineName" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="their LINE display name, exactly as it reads in your chat list" />
          <span class="block text-[11px] text-white/30 mt-1">Used to find the chat when a board member is asked about an application on LINE. It has to match exactly, or nothing is sent.</span></label>
        <label class="text-xs text-white/50">Company
          <input id="mfCompany" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50">Job title
          <input id="mfJobTitle" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50 sm:col-span-2">Address
          <textarea id="mfAddress" rows="2" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1 resize-none"></textarea></label>
        <label class="text-xs text-white/50">City
          <input id="mfCity" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50">Member since
          <input id="mfJoinDate" type="date" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
      </div>
      <div class="px-6 py-4 border-t border-white/10 flex justify-end gap-2">
        <button onclick="closeMemberForm()" class="btn-secondary px-4 py-2 rounded-lg text-sm font-medium">Cancel</button>
        <button id="mfSave" onclick="saveMemberForm()" class="btn-primary px-5 py-2 rounded-lg text-sm font-bold">Save</button>
      </div>
    </div>
  </div>

  <style>
    /* Compact variant of the shared toggle, for the dense member cards. */
    .toggle-track.toggle-sm { width: 30px; height: 17px; }
    .toggle-track.toggle-sm .toggle-thumb { width: 13px; height: 13px; }
    .toggle-track.toggle-sm.on .toggle-thumb { transform: translateX(13px); }
  </style>
  <script src="/admin/admin.js"></script>
  <script>
    requireAuthOrRedirect();

    let contacts = [];
    let statusFilter = 'active';   // active | pending | archived | all
    let editingMemberNo = null;    // null while adding
    let visibleMembers = [];       // what the grid is currently showing
    const photoCache = new Map();  // memberNo -> object URL

    const statusOf = (c) => (['active', 'pending', 'archived'].includes(c.status) ? c.status : 'active');

    async function loadContacts() {
      document.getElementById('contactsLoading').classList.remove('hidden');
      document.getElementById('contactsGrid').classList.add('hidden');
      document.getElementById('contactsEmpty').classList.add('hidden');
      try {
        const data = await apiFetch('/api/admin/contacts');
        contacts = data.contacts || [];
        renderContacts();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Failed to load contacts', 'error');
      }
      document.getElementById('contactsLoading').classList.add('hidden');
    }

    function renderContacts() {
      renderStatusFilters();
      const q = (document.getElementById('contactsSearch').value || '').trim().toLowerCase();
      const inScope = statusFilter === 'all' ? contacts : contacts.filter(c => statusOf(c) === statusFilter);
      const filtered = q
        ? inScope.filter(c => [c.firstName, c.lastName, c.email, c.city, c.phone, c.company]
            .some(v => (v || '').toLowerCase().includes(q)))
        : inScope;

      // Surname first, then first name; locale-aware so umlauts sort sensibly.
      filtered.sort((a, b) =>
        (a.lastName || '').localeCompare(b.lastName || '', 'de', { sensitivity: 'base' }) ||
        (a.firstName || '').localeCompare(b.firstName || '', 'de', { sensitivity: 'base' }));
      visibleMembers = filtered;

      const label = statusFilter === 'all' ? 'members' : statusFilter + ' members';
      const meta = document.getElementById('contactsMeta');
      meta.textContent = q
        ? `${filtered.length} of ${inScope.length} ${label} match "${q}"`
        : `${inScope.length} ${label}`;

      const grid = document.getElementById('contactsGrid');
      const empty = document.getElementById('contactsEmpty');
      if (filtered.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      grid.classList.remove('hidden');

      grid.innerHTML = filtered.map(c => {
        const name = escapeHtml(`${c.firstName || ''} ${c.lastName || ''}`.trim()) || '<span class="text-white/40">Unnamed</span>';
        const initials = ((c.firstName || ' ')[0] + (c.lastName || ' ')[0]).toUpperCase();
        const st = statusOf(c);
        const isBoard = !!c.isBoardMember;
        const fn = c.boardFunction || '';

        const avatar = `<div id="avatar-${c.memberNo}" class="w-10 h-10 rounded-full bg-rotary-gold/20 text-rotary-gold flex items-center justify-center text-xs font-bold flex-shrink-0 overflow-hidden">${escapeHtml(initials)}</div>`;

        const role = [c.jobTitle, c.company].filter(Boolean).join(' · ');
        const since = c.joinDate
          ? new Date(c.joinDate).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })
          : '';

        const pill = (text, cls) =>
          `<span class="text-[9px] uppercase tracking-wide ${cls} px-1.5 py-0.5 rounded-full font-bold whitespace-nowrap">${escapeHtml(text)}</span>`;
        const pills = [
          st === 'pending'  ? pill('Pending', 'bg-rotary-sky/25 text-rotary-sky') : '',
          st === 'archived' ? pill('Archived', 'bg-white/10 text-white/40') : '',
          isBoard && fn     ? pill(fn, 'bg-rotary-gold/20 text-rotary-gold') : '',
        ].join('');

        const iconBtn = (onclick, title, path, cls) =>
          `<button onclick="${onclick}" title="${title}" aria-label="${title}"
             class="w-6 h-6 rounded-md flex items-center justify-center text-white/30 hover:bg-white/10 ${cls} transition-colors">
             <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">${path}</svg>
           </button>`;
        const ICON = {
          edit: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>',
          archive: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>',
          restore: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>',
          check: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>',
        };
        const actions = [
          st === 'pending' ? iconBtn(`confirmMember(${c.memberNo})`, 'Confirm as member', ICON.check, 'text-green-400/70 hover:text-green-300') : '',
          iconBtn(`openMemberForm(${c.memberNo})`, 'Edit', ICON.edit, 'hover:text-white'),
          st === 'archived'
            ? iconBtn(`restoreMember(${c.memberNo})`, 'Restore', ICON.restore, 'hover:text-white')
            : iconBtn(`archiveMember(${c.memberNo})`, 'Archive', ICON.archive, 'hover:text-red-300'),
        ].join('');

        const line = (path, inner) => inner ? `<div class="flex items-center gap-1.5 min-w-0">
            <svg class="w-3 h-3 text-white/25 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">${path}</svg>
            <span class="truncate">${inner}</span></div>` : '';
        const mailPath = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>';
        const telPath  = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>';

        const emailLink = c.email
          ? `<a href="mailto:${escapeHtml(c.email)}" class="text-rotary-sky hover:text-rotary-gold transition-colors">${escapeHtml(c.email)}</a>` : '';
        const phoneLink = c.phone
          ? `<a href="tel:${escapeHtml((c.phone || '').replace(/\s+/g, ''))}" class="hover:text-rotary-gold transition-colors">${escapeHtml(c.phone)}</a>` : '';

        const boardRow = st === 'active' ? `
          <div class="mt-auto pt-2 border-t border-white/10 flex items-center gap-2">
            <div class="toggle-track toggle-sm ${isBoard ? 'on' : ''} flex-shrink-0" onclick="toggleBoard(${c.memberNo})" title="${isBoard ? 'On the board - receives applications by email' : 'Add to the board and the email recipients'}">
              <div class="toggle-thumb"></div>
            </div>
            ${isBoard
              ? `<input type="text" class="glass-input flex-1 min-w-0 px-2 py-1 rounded text-[11px]" placeholder="Board function" value="${escapeHtml(fn)}" onchange="updateBoardFunction(${c.memberNo}, this.value)" />`
              : `<span class="text-[11px] text-white/35">Board member</span>`}
          </div>` : '';

        return `
          <div class="rounded-lg bg-[#0a1628]/50 border ${isBoard ? 'border-rotary-gold/40' : 'border-white/10'} p-3 flex flex-col gap-2 hover:border-white/30 transition-colors">
            <div class="flex items-start gap-2.5">
              ${avatar}
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1 flex-wrap">
                  <span class="font-semibold text-[13px] leading-tight break-words">${name}</span>${pills}
                </div>
                ${role ? `<div class="text-[11px] text-white/45 truncate" title="${escapeHtml(role)}">${escapeHtml(role)}</div>` : ''}
                ${since ? `<div class="text-[10px] text-white/30">Member since ${since}</div>` : ''}
              </div>
              <div class="flex items-center gap-0.5 flex-shrink-0">${actions}</div>
            </div>
            <div class="text-[11px] text-white/60 space-y-0.5">
              ${line(mailPath, emailLink)}
              ${line(telPath, phoneLink)}
            </div>
            ${boardRow}
          </div>`;
      }).join('');

      hydratePhotos(filtered);
    }

    // The photo endpoint is password-protected and an <img src> cannot send the
    // header, so fetch each picture and swap in an object URL once it arrives.
    function showPhoto(memberNo, url) {
      const holder = document.getElementById('avatar-' + memberNo);
      if (!holder) return;
      const img = document.createElement('img');
      img.className = 'w-full h-full object-cover';
      img.alt = '';
      img.onload = () => { holder.textContent = ''; holder.appendChild(img); };
      img.src = url;   // initials stay until the picture is actually decoded
    }

    async function hydratePhotos(list) {
      for (const c of list) {
        if (!c.hasPhoto) continue;
        const el = document.getElementById('avatar-' + c.memberNo);
        if (!el) continue;
        if (photoCache.has(c.memberNo)) { showPhoto(c.memberNo, photoCache.get(c.memberNo)); continue; }
        try {
          const res = await fetch('/api/admin/member-photo?memberNo=' + encodeURIComponent(c.memberNo),
            { headers: { 'X-Admin-Password': adminPassword } });
          if (!res.ok) continue;
          const url = URL.createObjectURL(await res.blob());
          photoCache.set(c.memberNo, url);
          showPhoto(c.memberNo, url);
        } catch { /* leave the initials in place */ }
      }
    }

    // Opens a new mail in the default client, addressed BCC so members do not
    // see each other's addresses. Left unsent for editing.
    function emailAllMembers() {
      const recipients = [...new Set(visibleMembers.map(m => (m.email || '').trim()).filter(Boolean))];
      if (!recipients.length) { showToast('Nobody on screen has an email address', 'error'); return; }

      const href = 'mailto:?bcc=' + encodeURIComponent(recipients.join(',')) +
                   '&subject=' + encodeURIComponent('Rotary Club Bangkok DACH');
      // Very long mailto links are silently dropped by some mail clients.
      if (href.length > 1900) {
        navigator.clipboard.writeText(recipients.join(', ')).then(
          () => showToast(`${recipients.length} addresses copied - paste them into BCC`, 'success'),
          () => showToast('Too many addresses for a mail link', 'error'));
        return;
      }
      window.location.href = href;
      showToast(`Opening a new email to ${recipients.length} member${recipients.length === 1 ? '' : 's'}`, 'success');
    }

    function renderStatusFilters() {
      const counts = { active: 0, pending: 0, archived: 0 };
      contacts.forEach(c => { counts[statusOf(c)]++; });
      const tabs = [
        ['active', 'Active', counts.active],
        ['pending', 'Pending', counts.pending],
        ['archived', 'Archived', counts.archived],
        ['all', 'All', contacts.length],
      ];
      document.getElementById('statusFilters').innerHTML = tabs.map(([key, label, n]) => {
        const on = statusFilter === key;
        const badge = key === 'pending' && n > 0 && !on ? 'bg-rotary-sky/30 text-rotary-sky' : 'bg-white/10 text-white/50';
        return `<button onclick="setStatusFilter('${key}')"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${on ? 'bg-rotary-gold/20 text-rotary-gold' : 'bg-white/5 text-white/50 hover:text-white/80'}">
          ${label} <span class="ml-1 px-1.5 py-0.5 rounded-full text-[10px] ${on ? 'bg-rotary-gold/20' : badge}">${n}</span>
        </button>`;
      }).join('');
    }

    function setStatusFilter(key) {
      statusFilter = key;
      renderContacts();
    }

    // Every write goes through the API, which also keeps the email recipients
    // list in step with who is on the board.
    async function patchMember(memberNo, patch, successMessage) {
      try {
        const res = await apiFetch('/api/admin/contacts', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ memberNo, ...patch }),
        });
        const idx = contacts.findIndex(c => c.memberNo === memberNo);
        if (idx !== -1 && res && res.contact) contacts[idx] = res.contact;
        renderContacts();
        if (successMessage) showToast(successMessage, 'success');
        return res;
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast(err.message || 'Save failed', 'error');
        await loadContacts();   // resync after a rejected change
        return null;
      }
    }

    function toggleBoard(memberNo) {
      const c = contacts.find(x => x.memberNo === memberNo);
      if (!c) return;
      const next = !c.isBoardMember;
      patchMember(memberNo, { isBoardMember: next, boardFunction: next ? (c.boardFunction || '') : '' },
        next ? 'Added to the board and the email recipients' : 'Removed from the board and the email recipients');
    }

    function updateBoardFunction(memberNo, value) {
      const c = contacts.find(x => x.memberNo === memberNo);
      if (!c) return;
      const trimmed = (value || '').trim();
      if ((c.boardFunction || '') === trimmed) return;
      patchMember(memberNo, { isBoardMember: true, boardFunction: trimmed }, 'Saved');
    }

    function confirmMember(memberNo) {
      const c = contacts.find(x => x.memberNo === memberNo);
      if (!c) return;
      const name = [c.firstName, c.lastName].filter(Boolean).join(' ') || c.email;
      if (!confirm(`Confirm ${name} as a member of the club?`)) return;
      patchMember(memberNo, { status: 'active' }, 'Confirmed as a member');
    }

    function archiveMember(memberNo) {
      const c = contacts.find(x => x.memberNo === memberNo);
      if (!c) return;
      const name = [c.firstName, c.lastName].filter(Boolean).join(' ') || c.email;
      const extra = c.isBoardMember ? '\n\nThey will also stop being asked about applications.' : '';
      if (!confirm(`Archive ${name}? They will no longer count as a member.${extra}`)) return;
      patchMember(memberNo, { status: 'archived' }, 'Archived');
    }

    function restoreMember(memberNo) {
      patchMember(memberNo, { status: 'active' }, 'Restored as an active member');
    }

    // ==================== ADD / EDIT ====================
    let formPhoto = null;        // { content, mimeType } when a new one is chosen
    let formPhotoCleared = false;  // true when the existing one should be deleted

    // Square-crop and shrink in the browser so what we store is a small
    // thumbnail rather than a 5 MB phone picture.
    function pickFormPhoto(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const SIDE = 320;
          const side = Math.min(img.width, img.height);
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = SIDE;
          canvas.getContext('2d').drawImage(
            img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, SIDE, SIDE);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          formPhoto = { content: dataUrl.split(',')[1], mimeType: 'image/jpeg' };
          formPhotoCleared = false;
          showFormPhoto(dataUrl);
        };
        img.onerror = () => showToast('That image could not be read', 'error');
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function showFormPhoto(src) {
      const holder = document.getElementById('mfPhotoPreview');
      holder.innerHTML = src
        ? `<img src="${src}" alt="" class="w-full h-full object-cover">`
        : (document.getElementById('mfFirstName').value[0] || '') + (document.getElementById('mfLastName').value[0] || '') || '—';
      document.getElementById('mfPhotoRemove').classList.toggle('hidden', !src);
    }

    function removeFormPhoto() {
      formPhoto = null;
      formPhotoCleared = true;
      showFormPhoto(null);
    }

    async function saveFormPhoto(memberNo) {
      try {
        if (formPhoto) {
          await apiFetch('/api/admin/member-photo?memberNo=' + encodeURIComponent(memberNo), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formPhoto),
          });
          photoCache.delete(memberNo);
        } else if (formPhotoCleared) {
          await apiFetch('/api/admin/member-photo?memberNo=' + encodeURIComponent(memberNo), { method: 'DELETE' });
          photoCache.delete(memberNo);
        }
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Member saved, but the photo failed: ' + err.message, 'error');
      }
    }

    const FORM_FIELDS = {
      mfFirstName: 'firstName', mfLastName: 'lastName', mfEmail: 'email',
      mfPhone: 'phone', mfWhatsapp: 'whatsapp', mfLineName: 'lineName', mfCompany: 'company',
      mfJobTitle: 'jobTitle', mfAddress: 'address', mfCity: 'city',
      mfJoinDate: 'joinDate',
    };

    function openMemberForm(memberNo) {
      editingMemberNo = memberNo == null ? null : memberNo;
      const c = editingMemberNo == null ? {} : (contacts.find(x => x.memberNo === memberNo) || {});
      document.getElementById('memberModalTitle').textContent =
        editingMemberNo == null ? 'Add Member' : 'Edit Member';
      for (const [id, field] of Object.entries(FORM_FIELDS)) {
        let v = c[field] || '';
        // <input type="date"> only accepts yyyy-mm-dd
        if (field === 'joinDate' && v) v = String(v).slice(0, 10);
        document.getElementById(id).value = v;
      }
      formPhoto = null;
      formPhotoCleared = false;
      showFormPhoto(null);
      if (c.hasPhoto) {
        if (photoCache.has(c.memberNo)) showFormPhoto(photoCache.get(c.memberNo));
        else fetch('/api/admin/member-photo?memberNo=' + encodeURIComponent(c.memberNo),
              { headers: { 'X-Admin-Password': adminPassword } })
          .then(r => r.ok ? r.blob() : null)
          .then(b => { if (b) showFormPhoto(URL.createObjectURL(b)); })
          .catch(() => {});
      }

      const modal = document.getElementById('memberModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('mfFirstName').focus();
    }

    function closeMemberForm() {
      const modal = document.getElementById('memberModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      editingMemberNo = null;
    }

    async function saveMemberForm() {
      const payload = {};
      for (const [id, field] of Object.entries(FORM_FIELDS)) {
        payload[field] = document.getElementById(id).value.trim();
      }
      if (!payload.firstName && !payload.lastName && !payload.email) {
        showToast('Enter at least a name or an email address', 'error');
        return;
      }
      if (payload.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)) {
        showToast('Please enter a valid email address', 'error');
        document.getElementById('mfEmail').focus();
        return;
      }

      const btn = document.getElementById('mfSave');
      btn.disabled = true;
      try {
        if (editingMemberNo == null) {
          const created = await apiFetch('/api/admin/contacts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (created && created.contact) await saveFormPhoto(created.contact.memberNo);
          showToast('Member added', 'success');
          closeMemberForm();
          await loadContacts();
        } else {
          const memberNo = editingMemberNo;
          const res = await patchMember(memberNo, payload, 'Member updated');
          if (res) {
            await saveFormPhoto(memberNo);
            closeMemberForm();
            await loadContacts();
          }
        }
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast(err.message || 'Save failed', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('memberModal').classList.contains('hidden')) {
        closeMemberForm();
      }
    });

    document.getElementById('contactsSearch').addEventListener('input', renderContacts);

    if (adminPassword) loadContacts();
  </script>
</body>
</html>
