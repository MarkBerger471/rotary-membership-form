<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Planner · Admin | Rotary Club Bangkok DACH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="https://brandcenter.rotary.org/images/default-source/guidelines-images/color/rotary_masterbrand_simplified-color_rgb.svg" type="image/svg+xml" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rotary: { blue: '#17458f', gold: '#f7a81b', azure: '#0067c8', sky: '#00a2e0', cranberry: '#d41367' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.6s ease-out' },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/admin/admin.css" />
  <style>
    /* Cards are built from strings at render time, so the type colours live in
       CSS custom properties rather than generated Tailwind classes. */
    .mtype-club       { --mt: #f7a81b; --mt-bg: rgba(247, 168, 27, 0.20); --mt-br: rgba(247, 168, 27, 0.55); }
    .mtype-fellowship { --mt: #ff5f9e; --mt-bg: rgba(212, 19, 103, 0.30); --mt-br: rgba(255, 95, 158, 0.55); }
    .mtype-service    { --mt: #00a2e0; --mt-bg: rgba(0, 162, 224, 0.22); --mt-br: rgba(0, 162, 224, 0.55); }
    .mtype-other      { --mt: #b06ae8; --mt-bg: rgba(176, 106, 232, 0.22); --mt-br: rgba(176, 106, 232, 0.55); }

    .mcard { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.10); transition: all 0.25s ease; }
    .mcard:hover { background: rgba(255, 255, 255, 0.10); }
    .mcard.is-draft { border-color: var(--mt-br); border-style: dashed; }
    .mcard.is-active { background: var(--mt-bg); border-color: var(--mt-br); }
    .mcard.is-active:hover { background: var(--mt-bg); }

    .mcard .mday { color: rgba(255, 255, 255, 0.40); }
    .mcard.is-active .mday, .mcard.is-draft .mday { color: var(--mt); }
    .mcard .mnum { color: rgba(255, 255, 255, 0.50); }
    .mcard.is-active .mnum { color: #fff; }
    .mcard .mfield { border-top: 1px solid var(--mt-br); }
    .mcard .mfield:focus { background: rgba(255, 255, 255, 0.06); }
    .mcard select.mfield option { background: #0a1628; color: #fff; }
    .mcard .mflyer { color: var(--mt); border-top: 1px solid var(--mt-br); }
    .mcard .mflyer:hover { background: var(--mt-bg); }
    .mcard .mdot { background: var(--mt); }

    .mlegend { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 11px; color: rgba(255,255,255,0.65); }
    .mlegend i { width: 10px; height: 10px; border-radius: 3px; background: var(--mt); display: block; }
  </style>
</head>
<body class="font-sans text-white antialiased">

  <header class="sticky top-0 z-50 glass-header">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity" title="Application page">
        <img src="https://rotary-bkkdach.clubdesk.com/clubdesk/wwwfiles/logo.png" alt="Rotary Club Bangkok DACH" class="h-12 w-auto rounded-lg" />
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">Rotary Club</h1>
          <p class="text-xs text-glass-gold font-medium -mt-0.5">Bangkok DACH</p>
        </div>
      </a>
      <div class="flex items-center gap-4 text-sm text-glass-secondary">
        <div class="hidden sm:flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>office@rotary-club-bangkok-dach.org</span>
        </div>
        <button onclick="adminLogout()" class="text-white/40 hover:text-white/70 text-sm transition-colors flex items-center gap-1" title="Logout">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </div>
  </header>

  <header class="px-4 py-3" style="background: rgba(10, 22, 40, 0.6); backdrop-filter: blur(40px); border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div class="max-w-6xl mx-auto flex items-center">
      <div class="flex items-center gap-3">
        <a href="/admin" class="text-white/50 hover:text-white/80 transition-colors" title="Back to Admin">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/></svg>
        </a>
        <div class="h-5 w-px bg-white/20"></div>
        <h1 class="text-lg font-bold">Meeting Planner</h1>
        <span class="text-xs bg-rotary-gold/20 text-rotary-gold px-2 py-0.5 rounded-full font-medium">Admin</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 animate-fade-in">
    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-white/10 flex flex-wrap items-center gap-3 justify-between">
        <div>
          <h2 class="font-bold text-lg" id="meetingsTitle">Meetings</h2>
          <p id="meetingsMeta" class="text-white/40 text-xs mt-0.5">&nbsp;</p>
        </div>
        <div class="flex gap-2">
          <button onclick="openAddDate()" class="btn-primary px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Add a date
          </button>
          <button onclick="selectAllMeetings()" class="btn-secondary px-3 py-2 rounded-lg text-sm font-medium">Select all</button>
          <button onclick="clearAllMeetings()" class="btn-secondary px-3 py-2 rounded-lg text-sm font-medium">Clear</button>
        </div>
      </div>
      <div class="px-6 py-3 border-b border-white/10 flex flex-wrap gap-x-5 gap-y-2">
        <span class="mlegend mtype-club"><i></i>Club Meeting</span>
        <span class="mlegend mtype-fellowship"><i></i>Fellowship Dinner</span>
        <span class="mlegend mtype-service"><i></i>Service Project</span>
        <span class="mlegend mtype-other"><i></i>Other</span>
      </div>
      <div id="meetingsLoading" class="px-6 py-12 text-center text-white/40">
        <svg class="w-6 h-6 animate-spin mx-auto mb-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        Loading meetings...
      </div>
      <div id="meetingsContent" class="hidden p-6 space-y-7"></div>
    </div>
  </main>

  <!-- ==================== ADD DATE MODAL ==================== -->
  <div id="addDateModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeAddDate()"></div>
    <div class="relative h-full flex items-center justify-center p-4">
      <div class="glass-card rounded-2xl w-full max-w-sm p-6" onclick="event.stopPropagation()">
        <h3 class="font-bold text-lg mb-1">Add a date</h3>
        <p class="text-white/50 text-xs mb-4">Any day of the week — not every club event falls on a Wednesday.</p>
        <label class="block text-xs font-semibold text-white/60 mb-1.5">Date</label>
        <input type="date" id="addDateInput" class="glass-input w-full px-3 py-2 rounded-lg text-sm mb-4" />
        <label class="block text-xs font-semibold text-white/60 mb-1.5">Type</label>
        <select id="addTypeInput" class="glass-input w-full px-3 py-2 rounded-lg text-sm mb-5">
          <option value="club">Club Meeting</option>
          <option value="fellowship">Fellowship Dinner</option>
          <option value="service">Service Project</option>
          <option value="other">Other</option>
        </select>
        <div class="flex gap-2 justify-end">
          <button onclick="closeAddDate()" class="btn-secondary px-4 py-2 rounded-lg text-sm font-medium">Cancel</button>
          <button onclick="confirmAddDate()" class="btn-primary px-4 py-2 rounded-lg text-sm font-bold">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== FLYER MODAL ==================== -->
  <div id="flyerModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeFlyer()"></div>
    <div class="relative h-full w-full p-2 sm:p-4 flex items-center justify-center">
      <div class="relative w-full h-full max-w-7xl max-h-[96vh] bg-[#0a1628] rounded-2xl overflow-hidden shadow-2xl flex flex-col" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-white/10 flex-shrink-0">
          <div class="flex items-center gap-3 min-w-0">
            <h3 class="text-sm font-bold text-white truncate">Meeting Flyer</h3>
            <span id="flyerDateBadge" class="text-xs bg-rotary-gold/20 text-rotary-gold px-2 py-0.5 rounded-full font-medium whitespace-nowrap"></span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="printFlyer()" class="btn-primary px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
              Print / PDF
            </button>
            <button onclick="closeFlyer()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white" title="Close (Esc)">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <iframe id="flyerFrame" class="flex-1 w-full bg-[#0a1628]" frameborder="0"></iframe>
      </div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    requireAuthOrRedirect();

    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const TYPES = [
      { id: 'club',       label: 'Club Meeting' },
      { id: 'fellowship', label: 'Fellowship Dinner' },
      { id: 'service',    label: 'Service Project' },
      { id: 'other',      label: 'Other' },
    ];

    // The club plans by Rotary year (1 July – 30 June), not calendar year, so
    // the grid rolls over on 1 July rather than 1 January.
    function currentRotaryYear(today = new Date()) {
      const y = today.getUTCFullYear();
      const start = today.getUTCMonth() >= 6 ? y : y - 1;
      return { start: `${start}-07-01`, end: `${start + 1}-06-30`, label: `${start}/${String(start + 1).slice(2)}` };
    }
    const RY = currentRotaryYear();

    let gridDates = [];
    let meetings = {}; // { 'YYYY-MM-DD': { active, type, topic, presenter, venue, ... } }
    let pendingSave = null;
    let dirty = false;

    function toDs(d) {
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
    }
    function parseDs(ds) {
      const [y, m, d] = ds.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, d));
    }

    function generateWednesdays(startDs, endDs) {
      const out = [];
      const d = parseDs(startDs);
      const end = parseDs(endDs);
      while (d.getUTCDay() !== 3) d.setUTCDate(d.getUTCDate() + 1);
      while (d <= end) {
        out.push(toDs(d));
        d.setUTCDate(d.getUTCDate() + 7);
      }
      return out;
    }

    // Every Wednesday of the Rotary year plus whatever else is already stored —
    // one-off dates added by hand would otherwise be invisible in the grid.
    function buildGrid() {
      const set = new Set(generateWednesdays(RY.start, RY.end));
      for (const ds of Object.keys(meetings)) set.add(ds);
      gridDates = [...set].sort();
    }

    async function loadMeetings() {
      document.getElementById('meetingsLoading').classList.remove('hidden');
      document.getElementById('meetingsContent').classList.add('hidden');
      try {
        const data = await apiFetch('/api/admin/meetings');
        meetings = data.meetings || {};
        buildGrid();
        document.getElementById('meetingsTitle').textContent = `Rotary Year ${RY.label}`;
        renderMeetings();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Failed to load meetings', 'error');
      }
      document.getElementById('meetingsLoading').classList.add('hidden');
    }

    function renderMeetings() {
      const byMonth = {};
      for (const ds of gridDates) {
        const key = ds.slice(0, 7);
        (byMonth[key] = byMonth[key] || []).push(ds);
      }

      const activeCount = Object.values(meetings).filter(m => m && m.active).length;
      document.getElementById('meetingsMeta').textContent =
        `${activeCount} meeting${activeCount === 1 ? '' : 's'} scheduled · 1 July ${RY.start.slice(0, 4)} – 30 June ${RY.end.slice(0, 4)}`;

      const html = Object.keys(byMonth).sort().map(key => {
        const [yy, mm] = key.split('-').map(Number);
        const items = byMonth[key].map(ds => {
          const day = parseInt(ds.slice(8, 10), 10);
          const weekday = WEEKDAYS[parseDs(ds).getUTCDay()];
          const entry = meetings[ds];
          const isSel = !!(entry && entry.active);
          // A deselected date only earns the dashed "draft" outline if something
          // was actually typed for it; a date toggled off and back is just blank.
          const hasDraft = !!entry && !isSel &&
            !!(entry.topic || entry.presenter || entry.venue || entry.description || entry.photoUrl);
          const type = (entry && entry.type) || 'club';
          const state = isSel ? 'is-active' : hasDraft ? 'is-draft' : '';

          const deleteBtn = entry
            ? `<button type="button" onclick="deleteMeeting('${ds}')" title="Delete this meeting"
                 class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full flex items-center justify-center text-white/40 hover:text-red-300 hover:bg-red-500/20 transition-colors">
                 <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M4 7h16M10 4h4a1 1 0 011 1v2H9V5a1 1 0 011-1z"/></svg>
               </button>`
            : '';

          const draftPreview = hasDraft && (entry.topic || entry.presenter)
            ? `<div class="px-3 pb-2 text-[10px] text-white/50 italic truncate" title="${escapeHtml(entry.topic)}${entry.presenter ? ' — ' + escapeHtml(entry.presenter) : ''}">${escapeHtml(entry.topic || entry.presenter)}</div>`
            : '';

          const typeOptions = TYPES.map(t =>
            `<option value="${t.id}"${t.id === type ? ' selected' : ''}>${t.label}</option>`).join('');

          const editorHtml = isSel
            ? `<select class="mfield w-full bg-transparent border-0 px-3 py-2 text-[11px] font-semibold text-white focus:outline-none"
                 onchange="updateField('${ds}', 'type', this.value, true)">${typeOptions}</select>
              <input type="text" class="mfield w-full bg-transparent border-0 px-3 py-2 text-xs text-white placeholder-white/40 focus:outline-none"
                placeholder="Topic…" value="${escapeHtml(entry.topic)}" onchange="updateField('${ds}', 'topic', this.value)" />
              <input type="text" class="mfield w-full bg-transparent border-0 px-3 py-2 text-xs text-white placeholder-white/40 focus:outline-none"
                placeholder="Presenter…" value="${escapeHtml(entry.presenter)}" onchange="updateField('${ds}', 'presenter', this.value)" />
              <input type="text" class="mfield w-full bg-transparent border-0 px-3 py-2 text-xs text-white placeholder-white/40 focus:outline-none"
                placeholder="Venue…" value="${escapeHtml(entry.venue || '')}" onchange="updateField('${ds}', 'venue', this.value)" />
              <button type="button" onclick="openFlyer('${ds}')" class="mflyer block w-full px-3 py-2 text-[11px] font-bold uppercase tracking-wider hover:opacity-90 transition-colors text-center">
                Flyer →
              </button>`
            : '';

          return `<div class="mcard mtype-${type} ${state} relative rounded-xl overflow-hidden">
            ${deleteBtn}
            <button type="button" onclick="toggleMeeting('${ds}')" class="w-full text-left px-3 py-2.5">
              <div class="mday text-[10px] font-bold uppercase tracking-wider">${weekday}</div>
              <div class="mnum text-2xl font-extrabold leading-tight">${day}</div>
            </button>
            ${draftPreview}
            ${editorHtml}
          </div>`;
        }).join('');
        return `<div>
          <h3 class="text-xs font-bold text-white/60 mb-3 uppercase tracking-wider">${MONTH_NAMES[mm - 1]} ${yy}</h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 items-start">${items}</div>
        </div>`;
      }).join('');

      document.getElementById('meetingsContent').innerHTML = html;
      document.getElementById('meetingsContent').classList.remove('hidden');
    }

    async function saveNow() {
      clearTimeout(pendingSave);
      pendingSave = null;
      if (!dirty) return;
      dirty = false;
      try {
        await apiFetch('/api/admin/meetings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ meetings }),
        });
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Save failed', 'error');
      }
    }

    function scheduleSave() {
      dirty = true;
      clearTimeout(pendingSave);
      pendingSave = setTimeout(saveNow, 350);
    }

    function ensureEntry(ds) {
      if (!meetings[ds]) meetings[ds] = { active: false, type: 'club', topic: '', presenter: '', venue: '' };
      return meetings[ds];
    }

    function toggleMeeting(ds) {
      const e = ensureEntry(ds);
      e.active = !e.active;
      renderMeetings();
      scheduleSave();
    }

    function updateField(ds, field, value, rerender) {
      const e = ensureEntry(ds);
      const next = field === 'type' ? value : (value || '').trim();
      if (e[field] === next) return;
      e[field] = next;
      if (rerender) renderMeetings();
      scheduleSave();
    }

    async function deleteMeeting(ds) {
      if (!confirm(`Delete the meeting on ${formatFlyerDate(ds)}?\n\nThis removes the topic, speaker and flyer text for that date and cannot be undone.`)) return;
      // Flush first: a debounced save still holding this date would otherwise
      // land after the delete and resurrect it.
      await saveNow();
      delete meetings[ds];
      buildGrid();
      renderMeetings();
      try {
        await apiFetch('/api/admin/meetings', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: ds }),
        });
        showToast('Meeting deleted', 'success');
      } catch (err) {
        if (err.message !== 'Unauthorized') {
          showToast('Delete failed', 'error');
          loadMeetings();
        }
      }
    }

    function selectAllMeetings() {
      for (const ds of gridDates) ensureEntry(ds).active = true;
      renderMeetings();
      scheduleSave();
    }

    function clearAllMeetings() {
      for (const ds in meetings) meetings[ds].active = false;
      renderMeetings();
      scheduleSave();
    }

    // ==================== ADD DATE ====================
    function openAddDate() {
      const input = document.getElementById('addDateInput');
      const today = toDs(new Date());
      input.value = today >= RY.start && today <= RY.end ? today : RY.start;
      document.getElementById('addTypeInput').value = 'club';
      document.getElementById('addDateModal').classList.remove('hidden');
      input.focus();
    }

    function closeAddDate() {
      document.getElementById('addDateModal').classList.add('hidden');
    }

    async function confirmAddDate() {
      const ds = document.getElementById('addDateInput').value;
      const type = document.getElementById('addTypeInput').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) { showToast('Pick a date first', 'error'); return; }
      if (meetings[ds] && meetings[ds].active) { showToast('That date is already in the planner', 'error'); return; }
      closeAddDate();
      await saveNow();
      try {
        const res = await apiFetch('/api/admin/meetings', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: ds, active: true, type }),
        });
        meetings[ds] = res.meeting;
        buildGrid();
        renderMeetings();
        showToast('Date added', 'success');
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Could not add that date', 'error');
      }
    }

    if (adminPassword) loadMeetings();

    // ==================== FLYER MODAL ====================
    function ordinal(n) {
      const v = n % 100;
      if (v >= 11 && v <= 13) return 'th';
      switch (n % 10) { case 1: return 'st'; case 2: return 'nd'; case 3: return 'rd'; default: return 'th'; }
    }
    function formatFlyerDate(ds) {
      const [y, m, d] = ds.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dayName = dt.toLocaleDateString('en-US', { weekday: 'long', timeZone: 'UTC' });
      const monthName = dt.toLocaleDateString('en-US', { month: 'long', timeZone: 'UTC' });
      return `${dayName}, ${String(d).padStart(2,'0')}${ordinal(d)} ${monthName} ${y}`;
    }

    function openFlyer(ds) {
      document.getElementById('flyerDateBadge').textContent = formatFlyerDate(ds);
      document.getElementById('flyerFrame').src = `/admin/meeting-flyer?d=${encodeURIComponent(ds)}&embedded=1`;
      document.getElementById('flyerModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeFlyer() {
      const frame = document.getElementById('flyerFrame');
      try { frame.contentWindow && frame.contentWindow.postMessage({ type: 'flush' }, '*'); } catch {}
      setTimeout(() => {
        document.getElementById('flyerModal').classList.add('hidden');
        frame.src = 'about:blank';
        document.body.style.overflow = '';
        loadMeetings();
      }, 80);
    }

    function printFlyer() {
      const frame = document.getElementById('flyerFrame');
      try { frame.contentWindow && frame.contentWindow.print(); } catch (e) { showToast('Print failed', 'error'); }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!document.getElementById('flyerModal').classList.contains('hidden')) closeFlyer();
      else if (!document.getElementById('addDateModal').classList.contains('hidden')) closeAddDate();
    });
  </script>
</body>
</html>
