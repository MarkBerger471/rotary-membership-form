<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guests · Admin | Rotary Club Bangkok DACH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="https://brandcenter.rotary.org/images/default-source/guidelines-images/color/rotary_masterbrand_simplified-color_rgb.svg" type="image/svg+xml" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rotary: { blue: '#17458f', gold: '#f7a81b', azure: '#0067c8', sky: '#00a2e0', cranberry: '#d41367' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.6s ease-out' },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="font-sans text-white antialiased">

  <header class="sticky top-0 z-50 glass-header">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity" title="Application page">
        <img src="https://rotary-bkkdach.clubdesk.com/clubdesk/wwwfiles/logo.png" alt="Rotary Club Bangkok DACH" class="h-12 w-auto rounded-lg" />
        <div>
          <h1 class="text-lg font-bold text-white leading-tight">Rotary Club</h1>
          <p class="text-xs text-glass-gold font-medium -mt-0.5">Bangkok DACH</p>
        </div>
      </a>
      <div class="flex items-center gap-4 text-sm text-glass-secondary">
        <div class="hidden sm:flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          <span>office@rotary-club-bangkok-dach.org</span>
        </div>
        <button onclick="adminLogout()" class="text-white/40 hover:text-white/70 text-sm transition-colors flex items-center gap-1" title="Logout">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </div>
  </header>

  <header class="px-4 py-3" style="background: rgba(10, 22, 40, 0.6); backdrop-filter: blur(40px); border-bottom: 1px solid rgba(255,255,255,0.1);">
    <div class="max-w-6xl mx-auto flex items-center">
      <div class="flex items-center gap-3">
        <a href="/admin" class="text-white/50 hover:text-white/80 transition-colors" title="Back to Admin">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/></svg>
        </a>
        <div class="h-5 w-px bg-white/20"></div>
        <h1 class="text-lg font-bold">Guests</h1>
        <span class="text-xs bg-rotary-gold/20 text-rotary-gold px-2 py-0.5 rounded-full font-medium">Admin</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 animate-fade-in space-y-6">

    <!-- Quick add: the fast path when you have just met someone -->
    <div class="glass-card rounded-2xl overflow-hidden">
      <button type="button" onclick="togglePanel('addPanel')" class="w-full text-left px-6 py-4 border-b border-white/10 flex items-center gap-3 hover:bg-white/5 transition-colors">
        <div class="flex-1 min-w-0">
          <h2 class="font-bold text-lg">Add a guest</h2>
          <p class="text-white/40 text-xs mt-0.5">Met someone worth inviting? Add them here - takes seconds on a phone.</p>
        </div>
        <svg class="w-4 h-4 flex-shrink-0 transition-transform" data-chev fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="addPanel" class="p-6 flex flex-wrap gap-3 items-end">
        <label class="text-xs text-white/50 flex-1 min-w-[130px]">First name
          <input id="qaFirst" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="Anna" /></label>
        <label class="text-xs text-white/50 flex-1 min-w-[130px]">Last name
          <input id="qaLast" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="Meier" /></label>
        <label class="text-xs text-white/50 flex-1 min-w-[180px]">Mobile (with country code)
          <input id="qaPhone" type="tel" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="+66 81 234 5678" /></label>
        <label class="text-xs text-white/50 flex-1 min-w-[160px]">LINE name <span class="text-white/30">(optional)</span>
          <input id="qaLine" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="as it appears in LINE" /></label>
        <label class="text-xs text-white/50 flex-1 min-w-[160px]">LinkedIn <span class="text-white/30">(optional)</span>
          <input id="qaLinkedin" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="linkedin.com/in/..." /></label>
        <div class="text-xs text-white/50">Language<div class="flex items-center gap-2 mt-1"><span class="text-xs text-white/60">EN</span><div id="qaTrack" class="toggle-track toggle-sm" onclick="toggleLang('qa'); "><div class="toggle-thumb"></div></div><span class="text-xs text-white/60">DE</span></div></div>
        <div class="text-xs text-white/50">Thai<label class="flex items-center gap-2 mt-1 cursor-pointer"><input type="checkbox" id="qaThai" class="accent-rotary-gold w-4 h-4" onchange="" /><span class="text-xs text-white/60">Thai &ndash; address as Khun</span></label></div>
        <label class="text-xs text-white/50 flex-1 min-w-[160px]">Note (optional)
          <input id="qaNotes" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="met at the gala" /></label>
        <button onclick="quickAdd()" class="btn-primary px-5 py-2 rounded-lg text-sm font-bold">Add</button>
      </div>
    </div>

    <!-- Bulk import from a contacts export -->
    <div class="glass-card rounded-2xl overflow-hidden">
      <button type="button" onclick="togglePanel('importWrap')" class="w-full text-left px-6 py-4 border-b border-white/10 flex items-center gap-3 hover:bg-white/5 transition-colors">
        <div class="flex-1 min-w-0">
          <h2 class="font-bold text-lg">Import from WhatsApp</h2>
          <p class="text-white/40 text-xs mt-0.5">Choose your exported contacts file. It is read here in your browser - only the people you tick are saved.</p>
        </div>
        <svg class="w-4 h-4 flex-shrink-0 transition-transform" data-chev fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="importWrap" class="px-6 py-4">
        <button onclick="document.getElementById('importFile').click()" class="btn-secondary px-4 py-2 rounded-lg text-sm font-medium">Choose file</button>
        <input type="file" id="importFile" accept=".json,.vcf,.csv,.txt" class="hidden" onchange="loadImportFile(this)" />
      </div>
      <div id="importPanel" class="hidden">
        <div class="px-6 py-3 border-b border-white/10 flex flex-wrap gap-2 items-center">
          <input type="search" id="importSearch" class="glass-input flex-1 min-w-[180px] px-3 py-2 rounded-lg text-sm" placeholder="Search the file..." oninput="renderImport()" />
          <span id="importCount" class="text-xs text-white/40"></span>
          <button onclick="toggleAllImport(true)" class="text-xs px-3 py-1.5 rounded-lg bg-white/5 text-white/60 hover:text-white">Select all shown</button>
          <button onclick="toggleAllImport(false)" class="text-xs px-3 py-1.5 rounded-lg bg-white/5 text-white/60 hover:text-white">Clear</button>
          <div class="flex items-center gap-2" title="Language for everyone in this batch"><div class="flex items-center gap-2 mt-1"><span class="text-xs text-white/60">EN</span><div id="importTrack" class="toggle-track toggle-sm" onclick="toggleLang('import'); "><div class="toggle-thumb"></div></div><span class="text-xs text-white/60">DE</span></div></div>
          <div title="Address everyone in this batch as Khun"><label class="flex items-center gap-2 mt-1 cursor-pointer"><input type="checkbox" id="importThai" class="accent-rotary-gold w-4 h-4" onchange="" /><span class="text-xs text-white/60">Thai &ndash; address as Khun</span></label></div>
          <button onclick="saveSelected()" id="importSaveBtn" class="btn-primary px-4 py-2 rounded-lg text-sm font-bold">Add selected</button>
          <button onclick="closeImport()" class="text-xs px-3 py-1.5 rounded-lg bg-white/5 text-white/50 hover:text-white">Close</button>
        </div>
        <div id="importList" class="max-h-[420px] overflow-y-auto divide-y divide-white/5"></div>
      </div>
    </div>

    <!-- The guest list itself -->
    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 class="font-bold text-lg">Guest list</h2>
          <p id="guestsMeta" class="text-white/40 text-xs mt-0.5">&nbsp;</p>
        </div>
        <div class="flex items-center gap-2">
          <input type="search" id="guestSearch" class="glass-input px-3 py-2 rounded-lg text-sm" placeholder="Search guests..." oninput="renderGuests()" />
          <span id="guestArchivedToggle"></span>
          <span id="clearImportBtn"></span>
        </div>
      </div>
      <div id="guestsEmpty" class="hidden px-6 py-12 text-center text-white/40">
        <p class="font-medium">No guests yet</p>
        <p class="text-sm mt-1">Add one above, or import your WhatsApp contacts.</p>
      </div>
      <div id="guestsGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 p-4"></div>
    </div>
  </main>

  <div id="guestModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70"
       onclick="if (event.target === this) closeGuestForm()">
    <div class="glass-card rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between">
        <h3 class="font-bold text-lg">Edit guest</h3>
        <button onclick="closeGuestForm()" class="text-white/40 hover:text-white transition-colors" title="Close">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <label class="text-xs text-white/50">First name
          <input id="gfFirst" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" />
          <span class="text-[11px] text-white/35">used to address messages</span></label>
        <label class="text-xs text-white/50">Last name
          <input id="gfLast" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50">Mobile (with country code)
          <input id="gfPhone" type="tel" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <label class="text-xs text-white/50">LINE name
          <input id="gfLine" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="as it appears in LINE" />
          <span class="text-[11px] text-white/35">exactly as the chat is titled - the sender checks it before it types</span></label>
        <label class="text-xs text-white/50">LinkedIn
          <input id="gfLinkedin" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="linkedin.com/in/..." />
          <span class="text-[11px] text-white/35">their profile - paste the link, the tracking part is dropped</span></label>
        <label class="text-xs text-white/50">Company
          <input id="gfCompany" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" /></label>
        <div class="text-xs text-white/50">Language<div class="flex items-center gap-2 mt-1"><span class="text-xs text-white/60">EN</span><div id="gfTrack" class="toggle-track toggle-sm" onclick="toggleLang('gf'); updateGreetingPreview()"><div class="toggle-thumb"></div></div><span class="text-xs text-white/60">DE</span></div></div>
        <div class="text-xs text-white/50">Thai<label class="flex items-center gap-2 mt-1 cursor-pointer"><input type="checkbox" id="gfThai" class="accent-rotary-gold w-4 h-4" onchange="updateGreetingPreview()" /><span class="text-xs text-white/60">Thai &ndash; address as Khun</span></label></div>
        <label class="text-xs text-white/50 sm:col-span-2">Note
          <input id="gfNotes" class="glass-input w-full px-3 py-2 rounded-lg text-sm mt-1" placeholder="met at the gala" /></label>
        <p id="gfPreview" class="sm:col-span-2 text-xs text-rotary-gold/80"></p>
      </div>
      <div class="px-6 py-4 border-t border-white/10 flex justify-between gap-2">
        <button onclick="deleteFromForm()" class="px-4 py-2 rounded-lg text-sm font-medium text-white/40 hover:text-red-300 transition-colors">Delete</button>
        <div class="flex gap-2">
          <button onclick="closeGuestForm()" class="btn-secondary px-4 py-2 rounded-lg text-sm font-medium">Cancel</button>
          <button id="gfSave" onclick="saveGuestForm()" class="btn-primary px-5 py-2 rounded-lg text-sm font-bold">Save</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .toggle-track.toggle-sm { width: 34px; height: 19px; }
    .toggle-track.toggle-sm .toggle-thumb { width: 15px; height: 15px; }
    .toggle-track.toggle-sm.on .toggle-thumb { transform: translateX(15px); }
  </style>
  <script src="/admin/admin.js"></script>
  <script>
    requireAuthOrRedirect();

    let guests = [];
    let imported = [];            // parsed from the chosen file, never uploaded wholesale
    let importSelected = new Set();
    let showArchivedGuests = false;

    const digits = (s) => String(s || '').replace(/[^0-9]/g, '');

    async function loadGuests() {
      try {
        guests = (await apiFetch('/api/admin/guests')).guests || [];
        renderGuests();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Could not load guests', 'error');
      }
    }

    function renderGuests() {
      const q = (document.getElementById('guestSearch').value || '').trim().toLowerCase();
      const scope = guests.filter(g => showArchivedGuests ? g.status === 'archived' : g.status !== 'archived');
      const list = q ? scope.filter(g => [g.name, g.phone, g.lineName, g.linkedinUrl, g.notes, g.company].some(v => (v || '').toLowerCase().includes(q))) : scope;
      list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'de', { sensitivity: 'base' }));

      const archived = guests.filter(g => g.status === 'archived').length;
      document.getElementById('guestArchivedToggle').innerHTML = archived
        ? `<button onclick="toggleArchivedGuests()" class="text-xs px-3 py-2 rounded-lg ${showArchivedGuests ? 'bg-rotary-gold/20 text-rotary-gold' : 'bg-white/5 text-white/50 hover:text-white/80'}">${showArchivedGuests ? 'Show active' : 'Archived (' + archived + ')'}</button>`
        : '';
      const fromWhatsApp = guests.filter(g => g.source === 'whatsapp').length;
      document.getElementById('clearImportBtn').innerHTML = fromWhatsApp
        ? `<button onclick="clearWhatsAppImport()" class="text-xs px-3 py-2 rounded-lg bg-red-500/15 text-red-300 hover:bg-red-500/25 transition-colors whitespace-nowrap">Delete WhatsApp import (${fromWhatsApp})</button>`
        : '';
      document.getElementById('guestsMeta').textContent =
        `${scope.length} ${showArchivedGuests ? 'archived' : 'guest' + (scope.length === 1 ? '' : 's')}` + (q ? ` - ${list.length} match "${q}"` : '');

      const grid = document.getElementById('guestsGrid');
      const empty = document.getElementById('guestsEmpty');
      if (!list.length) { grid.classList.add('hidden'); empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden'); grid.classList.remove('hidden');

      grid.innerHTML = list.map(g => {
        const initials = (g.name || '?').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
        const invites = Array.isArray(g.invites) ? g.invites.length : 0;
        return `
        <div class="rounded-lg bg-[#0a1628]/50 border border-white/10 p-3 flex flex-col gap-2 hover:border-white/30 transition-colors">
          <div class="flex items-start gap-2.5">
            <div class="w-9 h-9 rounded-full bg-rotary-sky/20 text-rotary-sky flex items-center justify-center text-xs font-bold flex-shrink-0">${escapeHtml(initials)}</div>
            <div class="min-w-0 flex-1">
              <div class="font-semibold text-[13px] leading-tight break-words">${escapeHtml(g.name)}</div>
              ${g.firstName
                ? `<div class="text-[11px] text-white/35">greeted as &ldquo;${escapeHtml([g.honorific, g.firstName].filter(Boolean).join(' '))}&rdquo;
                     <span class="text-white/25">&middot; ${g.language === 'de' ? 'DE' : 'EN'}</span></div>`
                : `<div class="text-[11px] text-red-300/80">no first name - add one before inviting</div>`}
              ${g.notes ? `<div class="text-[11px] text-white/45">${escapeHtml(g.notes)}</div>` : ''}
              ${invites ? `<div class="text-[10px] text-rotary-gold/70 mt-0.5">invited ${invites}x</div>` : ''}
            </div>
            <div class="flex gap-0.5 flex-shrink-0">
              <button onclick="editGuest('${g.id}')" title="Edit" aria-label="Edit" class="w-6 h-6 rounded-md flex items-center justify-center text-white/30 hover:text-white hover:bg-white/10 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button onclick="setGuestArchived('${g.id}', ${g.status === 'archived' ? 'false' : 'true'})" title="${g.status === 'archived' ? 'Restore' : 'Archive'}" aria-label="${g.status === 'archived' ? 'Restore' : 'Archive'}" class="w-6 h-6 rounded-md flex items-center justify-center text-white/30 hover:text-rotary-gold hover:bg-white/10 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
              </button>
              <button onclick="deleteGuest('${g.id}')" title="Delete" aria-label="Delete" class="w-6 h-6 rounded-md flex items-center justify-center text-white/30 hover:text-red-400 hover:bg-white/10 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </div>
          <div class="text-[11px] text-white/60">
            <a href="tel:${escapeHtml((g.phone || '').replace(/\s+/g, ''))}" class="hover:text-rotary-gold transition-colors">${escapeHtml(g.phone || '')}</a>
            ${g.lineName ? `<span class="text-white/30">${g.phone ? '&middot; ' : ''}</span><span class="text-[#06C755]/80">LINE</span> <span class="text-white/45">${escapeHtml(g.lineName)}</span>` : ''}
            ${g.linkedinUrl ? `<span class="text-white/30">${g.phone || g.lineName ? '&middot; ' : ''}</span><a href="${escapeHtml(g.linkedinUrl)}" target="_blank" rel="noopener" class="text-[#0A66C2]/90 hover:text-rotary-gold">LinkedIn</a>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function toggleArchivedGuests() { showArchivedGuests = !showArchivedGuests; renderGuests(); }

    async function quickAdd() {
      const firstName = document.getElementById('qaFirst').value.trim();
      const lastName = document.getElementById('qaLast').value.trim();
      const name = [firstName, lastName].filter(Boolean).join(' ');
      const phone = document.getElementById('qaPhone').value.trim();
      const lineName = document.getElementById('qaLine').value.trim();
      const linkedinUrl = document.getElementById('qaLinkedin').value.trim();
      const notes = document.getElementById('qaNotes').value.trim();
      if (!firstName) { showToast('A first name is required - messages are addressed by it', 'error'); return; }
      // Any one way of reaching them is enough - some are only on LINE, some
      // only on LinkedIn.
      if (digits(phone).length < 8 && !lineName && !linkedinUrl) {
        showToast('Add a mobile number, a LINE name or a LinkedIn address', 'error'); return;
      }
      try {
        const res = await apiFetch('/api/admin/guests', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, firstName, lastName, phone, notes, waNumber: digits(phone), lineName, linkedinUrl,
            language: langOf('qa'), honorific: thaiOf('qa'), source: 'manual' }),
        });
        if (res.added) {
          showToast(name + ' added', 'success');
          ['qaFirst','qaLast','qaPhone','qaLine','qaLinkedin','qaNotes'].forEach(id => document.getElementById(id).value = '');
          document.getElementById('qaFirst').focus();
          loadGuests();
        } else {
          showToast((res.skipped && res.skipped[0] && res.skipped[0].reason) || 'Not added', 'error');
        }
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast(err.message || 'Could not add', 'error');
      }
    }

    // ---- import: parsed in the browser, nothing uploaded until you tick it
    function loadImportFile(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          imported = parseContacts(String(reader.result), file.name);
        } catch (err) {
          showToast('Could not read that file', 'error'); return;
        }
        if (!imported.length) { showToast('No contacts found in that file', 'error'); return; }
        importSelected = new Set();
        togglePanel('importWrap', true);
        document.getElementById('importPanel').classList.remove('hidden');
        renderImport();
        showToast(`${imported.length} contacts read - tick the ones to keep`, 'success');
      };
      reader.readAsText(file);
    }

    function parseContacts(text, filename) {
      const name = (filename || '').toLowerCase();
      if (name.endsWith('.json') || text.trim().startsWith('[')) {
        return JSON.parse(text).map(c => ({
          name: [c.firstName, c.lastName].filter(Boolean).join(' ') || c.name || '',
          firstName: c.firstName || '', lastName: c.lastName || '',
          phone: c.phone || c.waNumber, waNumber: digits(c.waNumber || c.phone), notes: c.notes || '',
        })).filter(c => c.name && c.waNumber);
      }
      if (name.endsWith('.vcf') || /BEGIN:VCARD/i.test(text)) {
        return text.split(/END:VCARD/i).map(card => {
          const fn = (card.match(/\nFN[^:]*:(.+)/i) || [])[1];
          const tel = (card.match(/\nTEL[^:]*:(.+)/i) || [])[1];
          if (!fn || !tel) return null;
          // vCard N is "Last;First;..." - the structured field beats guessing
          const n = (card.match(/\nN[^:]*:(.+)/i) || [])[1];
          let first = '', last = '';
          if (n) { const p = n.split(';'); last = (p[0] || '').trim(); first = (p[1] || '').trim(); }
          if (!first) { const p = fn.trim().split(/\s+/); first = p[0] || ''; last = p.slice(1).join(' '); }
          return { name: [first, last].filter(Boolean).join(' ') || fn.trim(),
                   firstName: first, lastName: last, phone: tel.trim(), waNumber: digits(tel), notes: '' };
        }).filter(c => c && c.waNumber);
      }
      // loose paste: "Name +66 81 234 5678" or "Name, 0812345678" per line
      return text.split(/\r?\n/).map(line => {
        const m = line.match(/^(.*?)[,;\t]?\s*(\+?[\d][\d\s\-()]{6,})\s*$/);
        if (!m) return null;
        const nm = m[1].replace(/[,;]$/, '').trim();
        if (!nm) return null;
        const p = nm.split(/\s+/);
        return { name: nm, firstName: p[0] || '', lastName: p.slice(1).join(' '),
                 phone: m[2].trim(), waNumber: digits(m[2]), notes: '' };
      }).filter(c => c && c.waNumber);
    }

    function renderImport() {
      const q = (document.getElementById('importSearch').value || '').trim().toLowerCase();
      const have = new Set(guests.map(g => digits(g.waNumber || g.phone)));
      const shown = q ? imported.filter(c => (c.name + ' ' + c.phone).toLowerCase().includes(q)) : imported;
      document.getElementById('importCount').textContent =
        `${importSelected.size} selected of ${imported.length}` + (q ? ` (${shown.length} shown)` : '');
      document.getElementById('importList').innerHTML = shown.map(c => {
        const already = have.has(c.waNumber);
        const on = importSelected.has(c.waNumber);
        return `<label class="flex items-center gap-3 px-6 py-2 hover:bg-white/5 cursor-pointer ${already ? 'opacity-40' : ''}">
          <input type="checkbox" ${on ? 'checked' : ''} ${already ? 'disabled' : ''} onchange="toggleImport('${c.waNumber}', this.checked)" class="accent-rotary-gold w-4 h-4 flex-shrink-0" />
          <span class="text-sm flex-1 min-w-0 truncate">${escapeHtml(c.name)}</span>
          <span class="text-xs text-white/40 flex-shrink-0">${escapeHtml(c.phone)}</span>
          ${already ? '<span class="text-[10px] uppercase text-white/30 flex-shrink-0">on list</span>' : ''}
        </label>`;
      }).join('');
    }

    function closeImport() {
      imported = []; importSelected = new Set();
      document.getElementById('importPanel').classList.add('hidden');
      document.getElementById('importSearch').value = '';
    }

    function toggleImport(wa, on) { on ? importSelected.add(wa) : importSelected.delete(wa); renderImport(); }
    function toggleAllImport(on) {
      const q = (document.getElementById('importSearch').value || '').trim().toLowerCase();
      const have = new Set(guests.map(g => digits(g.waNumber || g.phone)));
      const shown = q ? imported.filter(c => (c.name + ' ' + c.phone).toLowerCase().includes(q)) : imported;
      shown.forEach(c => { if (!have.has(c.waNumber)) on ? importSelected.add(c.waNumber) : importSelected.delete(c.waNumber); });
      renderImport();
    }

    async function saveSelected() {
      const chosen = imported.filter(c => importSelected.has(c.waNumber));
      if (!chosen.length) { showToast('Tick at least one contact', 'error'); return; }
      const btn = document.getElementById('importSaveBtn');
      btn.disabled = true;
      try {
        const res = await apiFetch('/api/admin/guests', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guests: chosen.map(c => ({
            name: c.name, firstName: c.firstName, lastName: c.lastName,
            phone: c.phone, waNumber: c.waNumber, notes: c.notes,
            language: langOf('import'), honorific: thaiOf('import'),
          })), source: 'whatsapp' }),
        });
        showToast(`${res.added} guest${res.added === 1 ? '' : 's'} added`, 'success');
        importSelected = new Set();
        await loadGuests();
        renderImport();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast(err.message || 'Import failed', 'error');
      } finally { btn.disabled = false; }
    }

    async function setGuestArchived(id, archived) {
      try {
        await apiFetch('/api/admin/guests', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, status: archived ? 'archived' : 'active' }),
        });
        showToast(archived ? 'Archived' : 'Restored', 'success');
        loadGuests();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Could not update', 'error');
      }
    }

    async function deleteGuest(id) {
      const g = guests.find(x => x.id === id);
      if (!confirm(`Delete ${g ? g.name : 'this guest'} permanently?\n\nArchive instead if you might invite them later.`)) return;
      try {
        await apiFetch('/api/admin/guests?id=' + encodeURIComponent(id), { method: 'DELETE' });
        showToast('Deleted', 'success');
        loadGuests();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Could not delete', 'error');
      }
    }

    // Undo a bulk import in one go, for when the wrong people came across.
    async function clearWhatsAppImport() {
      const n = guests.filter(g => g.source === 'whatsapp').length;
      if (!confirm(`Delete all ${n} guest${n === 1 ? '' : 's'} imported from WhatsApp?\n\n`
                 + 'Guests you added by hand are kept. You can import again from the file at any time.')) return;
      try {
        const res = await apiFetch('/api/admin/guests?source=whatsapp', { method: 'DELETE' });
        showToast(`${res.removed} removed`, 'success');
        await loadGuests();
        renderImport();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast('Could not clear the import', 'error');
      }
    }

    let editingGuestId = null;
    const GUEST_FIELDS = { gfFirst:'firstName', gfLast:'lastName', gfPhone:'phone', gfLine:'lineName', gfLinkedin:'linkedinUrl', gfCompany:'company', gfNotes:'notes' };

    // The guest list is what this page is for; the two input panels start
    // folded so it is not pushed below the fold, and the choice is remembered.
    const PANEL_KEY = 'rcbd:guests:panels:v1';
    function panelState() {
      try { return JSON.parse(localStorage.getItem(PANEL_KEY) || '{}'); } catch { return {}; }
    }
    function togglePanel(id, force) {
      const el = document.getElementById(id);
      if (!el) return;
      const open = force === undefined ? el.classList.contains('hidden') : force;
      el.classList.toggle('hidden', !open);
      const chev = el.previousElementSibling && el.previousElementSibling.querySelector('[data-chev]');
      if (chev) chev.style.transform = open ? '' : 'rotate(-90deg)';
      const st = panelState(); st[id] = open;
      try { localStorage.setItem(PANEL_KEY, JSON.stringify(st)); } catch {}
    }
    (function restorePanels() {
      const st = panelState();
      ['addPanel', 'importWrap'].forEach(id => togglePanel(id, st[id] === true));
    })();

    // Two controls instead of two dropdowns: a slider that is English on the
    // left and German on the right, and a tick that means "address as Khun".
    function toggleLang(base) {
      document.getElementById(base + 'Track').classList.toggle('on');
    }
    const langOf = (base) => document.getElementById(base + 'Track').classList.contains('on') ? 'de' : 'en';
    const thaiOf = (base) => document.getElementById(base + 'Thai').checked ? 'Khun' : '';
    function setLang(base, lang) {
      document.getElementById(base + 'Track').classList.toggle('on', lang === 'de');
    }

    function editGuest(id) {
      const g = guests.find(x => x.id === id);
      if (!g) return;
      editingGuestId = id;
      for (const [el, field] of Object.entries(GUEST_FIELDS)) {
        document.getElementById(el).value = g[field] || '';
      }
      setLang('gf', g.language || 'en');
      document.getElementById('gfThai').checked = (g.honorific || '') === 'Khun';
      updateGreetingPreview();
      const modal = document.getElementById('guestModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      document.getElementById('gfFirst').focus();
    }

    function closeGuestForm() {
      const modal = document.getElementById('guestModal');
      modal.classList.add('hidden'); modal.classList.remove('flex');
      editingGuestId = null;
    }

    // Show exactly how the invite will open, so a wrong first name is obvious
    // before it is sent rather than after.
    function updateGreetingPreview() {
      const first = document.getElementById('gfFirst').value.trim();
      const hon = thaiOf('gf');
      const de = langOf('gf') === 'de';
      const who = [hon, first].filter(Boolean).join(' ');
      document.getElementById('gfPreview').textContent = first
        ? `Message will start: \u201c${de ? 'Hallo' : 'Hello'} ${who}, ...\u201d  (${de ? 'German' : 'English'})`
        : 'No first name - this guest cannot be invited until one is set.';
    }

    async function saveGuestForm() {
      if (!editingGuestId) return;
      const v = {};
      for (const [el, field] of Object.entries(GUEST_FIELDS)) v[field] = document.getElementById(el).value.trim();
      if (!v.firstName) { showToast('A first name is required', 'error'); document.getElementById('gfFirst').focus(); return; }
      if (digits(v.phone).length < 8 && !v.lineName && !v.linkedinUrl) {
        showToast('Add a mobile number, a LINE name or a LinkedIn address', 'error');
        document.getElementById('gfPhone').focus(); return;
      }
      const btn = document.getElementById('gfSave');
      btn.disabled = true;
      try {
        await apiFetch('/api/admin/guests', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: editingGuestId, ...v, waNumber: digits(v.phone),
                                 language: langOf('gf'), honorific: thaiOf('gf') }),
        });
        showToast('Saved', 'success');
        closeGuestForm();
        loadGuests();
      } catch (err) {
        if (err.message !== 'Unauthorized') showToast(err.message || 'Could not save', 'error');
      } finally { btn.disabled = false; }
    }

    function deleteFromForm() {
      const id = editingGuestId;
      if (!id) return;
      closeGuestForm();
      deleteGuest(id);
    }

    document.getElementById('gfFirst').addEventListener('input', updateGreetingPreview);
    document.addEventListener('keydown', (e) => {
      const open = !document.getElementById('guestModal').classList.contains('hidden');
      if (!open) return;
      if (e.key === 'Escape') closeGuestForm();
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveGuestForm(); }
    });

    document.getElementById('qaPhone').addEventListener('keydown', e => { if (e.key === 'Enter') quickAdd(); });
    document.getElementById('qaFirst').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('qaLast').focus(); });
    document.getElementById('qaLast').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('qaPhone').focus(); });

    if (adminPassword) loadGuests();
  </script>
</body>
</html>
